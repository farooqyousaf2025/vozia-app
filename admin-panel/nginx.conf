# Voiza Admin Panel — SPA hosting with API reverse proxy.
# Inside the compose network the backend service is reachable as `backend:4000`.
# If you run this container standalone, add: --add-host=backend:host-gateway
# (or edit proxy_pass below to point at your backend host).
#
# TLS: this console carries a bearer JWT and the operator password, so plain HTTP is only ever a
# redirect target. Mount a keypair at /etc/nginx/tls/{privkey.pem,fullchain.pem} (a volume or a
# secret); nginx fails to start without them, which is the intended failure for a public deploy.
# On a throwaway local run, comment out the two `ssl_*` lines and the 443 block and serve :80
# directly — do not put that on the internet.

# Security headers shared by both listeners.
map $scheme $voiza_hsts {
    # HSTS is meaningless over plain HTTP and browsers ignore it there, so it is only sent on TLS.
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name _;

    # Everything except the container health probe moves to TLS.
    location = /.healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security $voiza_hsts always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API + Socket.IO traffic goes straight to the backend; the path is kept
    # intact because proxy_pass has no URI component.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO needs the Upgrade hop preserved, and a long read timeout so an idle
    # operator console is not cut between the server's 25s ping and its 20s pong window.
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must never be cached, so deployments take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
