# Voiza Admin Panel — SPA hosting with API reverse proxy.
# Inside the compose network the backend service is reachable as `backend:4000`.
# If you run this container standalone, add: --add-host=backend:host-gateway
# (or edit proxy_pass below to point at your backend host).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # API + Socket.IO traffic goes straight to the backend; the path is kept
    # intact because proxy_pass has no URI component.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must never be cached, so deployments take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing fallback: unknown paths render index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
