# Voiza Android — Gradle project properties
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.5.2 is only tested up to compileSdk 34; the project targets 35.
android.suppressUnsupportedCompileSdk=35

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Build-target overrides (fall back to the defaults compiled into BuildConfig
# when unset; can also be provided as environment variables VOIZA_*).
# Emulator -> host machine is 10.0.2.2. For a real VPS set e.g.:
#   VOIZA_API_BASE_URL=https://api.voiza.example.com
#   VOIZA_LIVEKIT_URL=wss://livekit.example.com
# ---------------------------------------------------------------------------
#VOIZA_API_BASE_URL=http://10.0.2.2:4000
#VOIZA_LIVEKIT_URL=ws://10.0.2.2:7880
